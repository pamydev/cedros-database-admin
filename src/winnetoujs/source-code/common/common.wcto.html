<winnetou d="simple div">
  <div
    id="[[div]]"
    class="{{class?}}"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{content?}}
  </div>
</winnetou>

<winnetou d="button primary">
  <button
    id="[[buttonPrimary]]"
    class="primary"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{icon?}} {{content?}}
  </button>
</winnetou>

<winnetou d="button secondary">
  <button
    id="[[buttonSecondary]]"
    class="secondary"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{icon?}} {{content?}}
  </button>
</winnetou>

<winnetou d="input">
  <form onsubmit="return false;" id="[[inputForm]]">
    <label for="[[input]]">
      {{label?}}
      <span class="__description-text">{{description?}}</span>
    </label>

    <input
      id="[[input]]"
      type="{{type?}}"
      placeholder="{{placeholder?}}"
      value="{{value?}}"
      onchange="{{onchange?}}"
      required="{{required?}}"
      style="{{style?}}" />
  </form>
</winnetou>

<winnetou d="textarea">
  <form onsubmit="return false;" id="[[textareaForm]]">
    <label for="[[textarea]]">
      {{label?}}
      <span class="__description-text">{{description?}}</span>
    </label>

    <textarea
      id="[[textarea]]"
      placeholder="{{placeholder?}}"
      onchange="{{onchange?}}"
      required="{{required?}}"
      style="{{style?}}">
{{value?}}</textarea>
  </form>
</winnetou>

<winnetou d="file">
  <form onsubmit="return false;" id="[[fileForm]]">
    <label for="[[file]]">
      {{label?}}
      <span class="__description-text">{{description?}}</span>
    </label>

    <div
      class="input-file-div"
      onclick="document.getElementById('[[file]]').click()">
      <span>Choose File</span>
      <span id="[[resourceName]]"></span>
    </div>

    <input
      id="[[file]]"
      type="file"
      onchange="let fileName = document.getElementById('[[file]]').files[0]?.name; document.getElementById('[[resourceName]]').innerText = fileName ? fileName : ''; {{onchange?}}"
      required="{{required?}}"
      style="display: none" />
  </form>
</winnetou>

<winnetou d="background image">
  <div
    id="[[backgroundImage]]"
    class="background-image"
    style="background-image: url('{{imageUrl?}}'); {{style?}}">
    {{content?}}
  </div>
</winnetou>

<winnetou d="image">
  <img id="[[image]]" src="{{src?}}" alt="{{alt?}}" style="{{style?}}" />
</winnetou>
