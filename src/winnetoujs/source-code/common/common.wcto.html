<winnetou d="simple div">
  <div
    id="[[div]]"
    class="{{class?}}"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{content?}}
  </div>
</winnetou>

<winnetou d="button primary">
  <button
    id="[[buttonPrimary]]"
    class="primary"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{icon?}} {{content?}}
  </button>
</winnetou>

<winnetou d="button secondary">
  <button
    id="[[buttonSecondary]]"
    class="secondary"
    onclick="{{onclick?}}"
    style="{{style?}}">
    {{icon?}} {{content?}}
  </button>
</winnetou>
