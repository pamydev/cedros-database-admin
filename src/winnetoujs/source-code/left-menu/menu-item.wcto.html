<winnetou d="Left menu item">
  <button
    id="[[menuItem]]"
    class="left-menu__item"
    type="button"
    aria-label="{{ariaLabel:string}}"
    onclick="{{onclick:string}}">
    <span class="left-menu__icon" aria-hidden="true">{{icon:string}}</span>
    <span class="left-menu__label">{{label:string}}</span>
  </button>
</winnetou>
